    <style>
        .mark { fill: rgb(35,31,32); } /* light mode: dark ink, for contrast on a light tab bar */
        @media (prefers-color-scheme: dark) {
            .mark { fill: #ffffff; } /* dark mode: white, for contrast on a dark tab bar */
        }
    </style>
