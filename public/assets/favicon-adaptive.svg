<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<!--
  Adaptive favicon — same X mark as assets/logo-mark.svg, but switches
  fill colour automatically based on the visitor's OS/browser colour
  scheme, using a plain CSS media query embedded in the SVG itself (no
  JavaScript, no separate files to swap). Supported in Chrome, Edge, and
  Firefox; Safari currently always shows the light-mode (dark ink)
  version regardless of system theme, since it doesn't yet apply
  prefers-color-scheme inside favicon SVGs.
-->
