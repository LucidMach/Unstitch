name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Run Test Suite
        run: pnpm test
        env:
          DATABASE_URL: "postgresql://ci_mock:ci_mock@ep-ci-mock.ap-southeast-2.aws.neon.tech/unstitch_ci?sslmode=require"
          RESEND_API_KEY: "re_ci_mock_key"

      - name: Typecheck Astro & TypeScript
        run: npx astro check

      - name: Build Astro Project
        run: pnpm build

